<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calificaciones IBIME</title>
<style>
:root{--p:#004080;--p2:#0b5fa5;--bad:#c62828;--bg:#f0f2f5;--card:#fff;--ok:#2e7d32;--muted:#667085;--border:#d9dee7}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#222}header{background:var(--p);color:#fff;padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 8px #0002}header b{margin-right:auto;font-size:18px}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:#e3f2fd;color:var(--p);font-weight:600}nav button.on{background:#fff}button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:#e8eef5;color:var(--p);font-weight:600}button.p{background:var(--p);color:#fff}button.danger{background:#ffebee;color:var(--bad)}button:disabled{opacity:.5}main{max-width:1180px;margin:20px auto;padding:0 16px}h2{margin-top:0}h3{margin-top:26px}input,select{padding:9px;border:1px solid var(--border);border-radius:8px;font:inherit;background:#fff}label{display:flex;flex-direction:column;gap:5px;font-weight:600;color:#475467}.fila{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;background:var(--card);padding:10px;border-radius:10px;box-shadow:0 1px 3px #0001}.fila input,.fila select{flex:1;min-width:150px}.fila .u{flex:3;min-width:280px}table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#f7f9fb}.table-wrap{overflow:auto}pre{white-space:pre-wrap;background:var(--card);padding:12px;border-radius:10px;min-height:40px}.msg{color:var(--bad)}#login{text-align:center;margin-top:20vh}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:18px 0}.cards>div{background:var(--card);padding:20px;border-radius:12px;box-shadow:0 1px 5px #0001}.cards b{display:block;font-size:30px;color:var(--p)}.cards span{color:#666}.perfil{display:flex;align-items:center;gap:14px;background:var(--card);padding:16px;border-radius:12px}.perfil img{width:58px;height:58px;border-radius:50%;object-fit:cover}.perfil h2{margin:0 0 4px}.perfil p{margin:0;color:#666}.acciones{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.empty{background:var(--card);padding:24px;border-radius:10px;color:#666}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.section-head p{color:var(--muted);margin:4px 0}.editor{background:var(--card);padding:16px;border-radius:12px;margin:12px 0;border:1px solid var(--border)}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}.tools{display:flex;gap:8px;margin:12px 0}.tools input{flex:1}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:13px}@media(max-width:700px){header{padding:10px}table{white-space:nowrap}.section-head{align-items:flex-start;flex-direction:column}.fila{align-items:stretch}.fila input,.fila select,.fila .u{min-width:100%}}
</style></head>
<body>
<header><b>Calificaciones IBIME</b><nav id="nav"></nav><button id="out" hidden>Salir</button></header>
<main id="main"><div id="login"><h2>Importación de calificaciones</h2><button class="p" id="in">Entrar con cuenta @ibime.edu.mx</button><p class="msg" id="err"></p></div></main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script type="module" src="app.js"></script>
</body></html>
