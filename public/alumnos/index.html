<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07345c">
  <meta name="description" content="Consulta tus calificaciones del Instituto Bíblico México.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IBIME Alumnos">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/alumnos/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/alumnos/alumno.css">
  <title>Mis calificaciones · IBIME</title>
</head>
<body>
  <header>
    <a class="brand" href="/alumnos/" aria-label="IBIME - Panel del alumno">
      <img src="/assets/logo-ibime.png" alt="IBIME" class="brand-logo">
      <span class="brand-copy"><strong>Mis calificaciones</strong><small>Portal del alumno IBIME</small></span>
    </a>
    <nav id="nav" aria-label="Navegación principal"></nav>
    <div class="header-actions">
      <button id="installApp" class="install-btn" type="button" hidden>Instalar app</button>
      <button id="out" type="button" hidden>Salir</button>
    </div>
  </header>

  <main id="main">
    <section id="login" class="login-card">
      <div class="login-logo-wrap"><img src="/assets/logo-ibime.png" alt="Instituto Bíblico México" class="login-logo"></div>
      <span class="eyebrow">PANEL DEL ALUMNO</span>
      <h1>Mis calificaciones</h1>
      <p class="login-lead">Consulta tu desglose por materia, identifica tus áreas de oportunidad y contacta a tus docentes.</p>
      <button class="google-btn" id="in" type="button">
        <span class="google-icon" aria-hidden="true">G</span>
        <span>Continuar con Google</span>
      </button>
      <p class="login-note">Acceso exclusivo con tu correo institucional <strong>@ibime.edu.mx</strong></p>
      <p class="msg" id="err" role="alert" hidden></p>
      <button id="installLogin" class="install-link" type="button" hidden>Instalar en este dispositivo</button>
    </section>
  </main>

  <footer class="site-footer"><span>IBIME</span><span>•</span><span>Portal del alumno</span></footer>

  <script type="module" src="/alumnos/alumno.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
    let deferredInstallPrompt = null;
    const toggleInstall = on => ['installApp','installLogin'].forEach(id => { const el = document.getElementById(id); if (el) el.hidden = !on; });
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt = e; toggleInstall(true); });
    async function installIBIME() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null; toggleInstall(false);
    }
    document.addEventListener('click', e => { if (e.target.closest('#installApp, #installLogin')) installIBIME(); });
  </script>
</body>
</html>
